<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Biodiesel em 3D</title>
<style>
:root{--bg:#f6f3e8;--fg:#14301f;--card:#ffffff;--line:#d9d4c2;--acc:#a8741a;--mut:#5a6659;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f2216;--fg:#f6f3e8;--card:#17301f;--line:#2b4a35;--acc:#e0a526;--mut:#a9b8a8}}
:root[data-theme="dark"]{--bg:#0f2216;--fg:#f6f3e8;--card:#17301f;--line:#2b4a35;--acc:#e0a526;--mut:#a9b8a8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif;line-height:1.45}
main{max-width:980px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:clamp(24px,4vw,38px);margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 14px}
#stage{position:relative;width:100%;height:min(62vh,520px);min-height:320px;border-radius:16px;overflow:hidden;background:radial-gradient(circle at 50% 35%,#27503a,#0b1a11);border:1px solid var(--line)}
#stage canvas{display:block;width:100%;height:100%;touch-action:pan-y;cursor:grab}
.badge{position:absolute;top:12px;left:12px;background:rgba(0,0,0,.55);color:#f6f3e8;padding:6px 12px;border-radius:999px;font:600 14px system-ui,sans-serif}
.hint{position:absolute;bottom:10px;right:12px;color:#cfe0cf;font:13px system-ui,sans-serif;opacity:.85}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin:12px 0;font:14px system-ui,sans-serif}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.panel h2{margin:0 0 6px;font-size:22px;color:var(--acc)}
.panel p{margin:6px 0}
.cur{color:var(--mut);font-style:italic}
.ctrl{display:flex;gap:12px;align-items:center;margin-top:14px;flex-wrap:wrap}
button{font:600 15px system-ui,sans-serif;background:var(--acc);color:#14301f;border:0;border-radius:10px;padding:10px 18px;cursor:pointer}
button.alt{background:transparent;color:var(--fg);border:1px solid var(--line)}
input[type=range]{flex:1;min-width:180px;accent-color:#e0a526}
.steps{display:flex;gap:6px;margin-top:10px;font:13px system-ui,sans-serif;color:var(--mut);justify-content:space-between;flex-wrap:wrap}
.steps b{color:var(--fg)}
</style>
</head>
<body>
<main>
<h1>Como o óleo vira biodiesel</h1>
<p class="sub">Arraste para girar o reator. Use o controle de tempo para ver cada etapa da transesterificação.</p>
<div id="stage"><div class="badge" id="badge">Temperatura ambiente</div><div class="hint">arraste para girar</div></div>
<div class="legend">
<span><i class="dot" style="background:#e8761a"></i>Triglicerídeo (óleo)</span>
<span><i class="dot" style="background:#4aa3e0"></i>Metóxido (álcool + catalisador)</span>
<span><i class="dot" style="background:#f2c230"></i>Biodiesel (éster)</span>
<span><i class="dot" style="background:#6b3a1a"></i>Glicerol</span>
</div>
<div class="panel">
<h2 id="ttl"></h2>
<p id="txt"></p>
<p class="cur" id="cur"></p>
<div class="ctrl">
<button id="play">Iniciar</button>
<button class="alt" id="reset">Reiniciar</button>
<input id="sl" type="range" min="0" max="1000" value="0" aria-label="Tempo da reação">
</div>
<div class="steps"><span><b>1</b> Óleo</span><span><b>2</b> Metóxido</span><span><b>3</b> Reação</span><span><b>4</b> Decantação</span></div>
</div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
var T=THREE,stage=document.getElementById('stage');
var W=stage.clientWidth,H=stage.clientHeight;
var renderer=new T.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setSize(W,H);stage.insertBefore(renderer.domElement,stage.firstChild);
var scene=new T.Scene();
var cam=new T.PerspectiveCamera(40,W/H,0.1,100);cam.position.set(0,2.6,7.6);cam.lookAt(0,1,0);
scene.add(new T.AmbientLight(0xffffff,0.7));
var dl=new T.DirectionalLight(0xffffff,0.9);dl.position.set(4,6,5);scene.add(dl);
var pl=new T.PointLight(0xff5a1a,0,6);pl.position.set(0,-0.1,0);scene.add(pl);
var g=new T.Group();scene.add(g);
function sm(x){x=Math.max(0,Math.min(1,x));return x*x*(3-2*x)}
function rnd(a,b){return a+Math.random()*(b-a)}
/* vidro */
var glass=new T.Mesh(new T.CylinderGeometry(1,1,2.1,48,1,true),new T.MeshPhongMaterial({color:0xcfe8ff,transparent:true,opacity:0.14,side:T.DoubleSide,shininess:90}));
glass.position.y=1.05;g.add(glass);
var base=new T.Mesh(new T.CylinderGeometry(1,1,0.06,48),new T.MeshPhongMaterial({color:0xcfe8ff,transparent:true,opacity:0.3}));
base.position.y=0.07;g.add(base);
var rim=new T.Mesh(new T.TorusGeometry(1,0.025,8,48),new T.MeshPhongMaterial({color:0xe6f2ff}));
rim.rotation.x=Math.PI/2;rim.position.y=2.1;g.add(rim);
/* chapa de aquecimento */
var plate=new T.Mesh(new T.CylinderGeometry(1.4,1.5,0.22,48),new T.MeshPhongMaterial({color:0x2b2b2b,emissive:0x000000}));
plate.position.y=-0.07;g.add(plate);
/* camadas de líquido */
var liqGeo=new T.CylinderGeometry(0.95,0.95,1,40);
function liqMat(){return new T.MeshPhongMaterial({color:0x8a5a14,transparent:true,opacity:0.6})}
var top=new T.Mesh(liqGeo,liqMat()),bot=new T.Mesh(liqGeo,liqMat());g.add(top);g.add(bot);
var Y0=0.1,HT=1.9;
/* partículas */
var sph=new T.SphereGeometry(1,16,12);
function ball(c){var m=new T.Mesh(sph,new T.MeshPhongMaterial({color:c,shininess:60}));g.add(m);return m}
var P=[],i,j;
for(i=0;i<24;i++){
 var a=rnd(0,6.283),r=rnd(0,0.7);
 var p={home:new T.Vector3(Math.cos(a)*r,rnd(0.4,1.75),Math.sin(a)*r),th:rnd(0.38,0.64),ph:rnd(0,6),m:ball(0xe8761a),c:[]};
 for(j=0;j<4;j++){
  var gl=j===3,aa=rnd(0,6.283),rr=gl?rnd(0,0.8):rnd(0,0.8);
  var off=new T.Vector3(rnd(-1,1),rnd(-1,1),rnd(-1,1)).normalize().multiplyScalar(0.18);
  p.c.push({m:ball(gl?0x6b3a1a:0xf2c230),gl:gl,off:off,ph:rnd(0,6),
   fin:new T.Vector3(Math.cos(aa)*rr,gl?rnd(0.2,0.42):rnd(0.7,1.95),Math.sin(aa)*rr)});
 }
 P.push(p);
}
var A=[];
for(i=0;i<40;i++){var a2=rnd(0,6.283),r2=rnd(0,0.85);
 A.push({home:new T.Vector3(Math.cos(a2)*r2,rnd(0.3,1.9),Math.sin(a2)*r2),ph:rnd(0,6),m:ball(0x4aa3e0)})}
function jit(v,ph,tm,am){return v.set(Math.sin(tm*1.3+ph)*am,Math.sin(tm*1.7+ph*1.9)*am,Math.sin(tm*1.1+ph*2.3)*am)}
var tmp=new T.Vector3(),tmp2=new T.Vector3();
var cOil=new T.Color(0x8a5a14),cMix=new T.Color(0x9a6a1c),cTop=new T.Color(0xe8b923),cBot=new T.Color(0x4a2a12),cc=new T.Color();
var S=[
 ['1. Óleo usado e filtrado','O óleo é formado por triglicerídeos: moléculas grandes (laranja) com glicerol ligado a três ácidos graxos.','Curiosidade: o óleo é viscoso porque essas moléculas são enormes e se enroscam.','Temperatura ambiente'],
 ['2. Entra o metóxido','Álcool (metanol ou etanol) e catalisador (NaOH ou KOH) formam o metóxido. As bolinhas azuis se espalham pelo óleo.','Curiosidade: o metóxido é o catalisador de verdade. A base sozinha não faz o trabalho.','Aquecendo...'],
 ['3. Reação de transesterificação','Com cerca de 60 °C e agitação, cada triglicerídeo se quebra em 3 ésteres (biodiesel, amarelo) e 1 glicerol (marrom).','Curiosidade: usa-se excesso de álcool para empurrar a reação reversível a formar mais biodiesel.','≈ 60 °C, agitando'],
 ['4. Decantação','Com a mistura parada, o biodiesel, mais leve, sobe. O glicerol, mais denso, desce e forma uma camada no fundo.','Curiosidade: o glicerol é o subproduto que pode virar sabão. Nada se perde.','Em repouso']
];
var ttl=document.getElementById('ttl'),txt=document.getElementById('txt'),cur=document.getElementById('cur'),bd=document.getElementById('badge'),sl=document.getElementById('sl'),pb=document.getElementById('play');
var t=0,playing=false,last=0,cs=-1,time=0;
function stg(t){return t<0.2?0:t<0.35?1:t<0.7?2:3}
function upd(){
 var d=sm((t-0.7)/0.25);
 var stir=sm((t-0.33)/0.05)*(1-sm((t-0.68)/0.05));
 var heat=sm((t-0.25)/0.1)*(1-sm((t-0.72)/0.08));
 var hb=0.001+0.4*d;
 bot.scale.y=hb;bot.position.y=Y0+hb/2;
 top.scale.y=HT-hb;top.position.y=Y0+hb+(HT-hb)/2;
 cc.copy(cOil).lerp(cMix,sm((t-0.2)/0.15));
 top.material.color.copy(cc).lerp(cTop,d);top.material.opacity=0.6-0.25*d;
 bot.material.color.copy(cc).lerp(cBot,d);bot.material.opacity=0.6+0.2*d;
 plate.material.emissive.setRGB(0.9*heat,0.18*heat,0);pl.intensity=1.6*heat;
 var amAl=sm((t-0.2)/0.1)*(1-sm((t-0.45)/0.25));
 A.forEach(function(a){
  jit(tmp,a.ph,time,0.04+0.1*stir);a.m.position.copy(a.home).add(tmp);
  a.m.scale.setScalar(0.045*amAl+0.0001);a.m.visible=amAl>0.01;
 });
 var amp=0.015+0.02*sm((t-0.25)/0.1)+0.1*stir;
 P.forEach(function(p){
  jit(tmp,p.ph,time,amp);
  var pp=tmp2.copy(p.home).add(tmp);
  var s=sm((t-p.th)/0.05);
  p.m.position.copy(pp);p.m.scale.setScalar(0.15*(1-s)+0.0001);p.m.visible=s<0.99;
  p.c.forEach(function(c){
   var hm=new T.Vector3().copy(p.home).add(c.off).lerp(c.fin,d);
   jit(tmp,c.ph,time,amp*(1-0.9*d));
   hm.add(tmp);
   c.m.position.copy(pp).lerp(hm,s);
   c.m.scale.setScalar(0.075*s+0.0001);c.m.visible=s>0.01;
  });
 });
 var k=stg(t);
 if(k!==cs){cs=k;ttl.textContent=S[k][0];txt.textContent=S[k][1];cur.textContent=S[k][2];bd.textContent=S[k][3]}
 sl.value=Math.round(t*1000);
}
sl.addEventListener('input',function(){t=sl.value/1000;upd()});
pb.addEventListener('click',function(){
 if(t>=1)t=0;playing=!playing;pb.textContent=playing?'Pausar':(t>0?'Continuar':'Iniciar');
});
document.getElementById('reset').addEventListener('click',function(){playing=false;t=0;pb.textContent='Iniciar';upd()});
/* girar com o dedo ou mouse */
var drag=false,px=0,ry=0.5;
var cv=renderer.domElement;
cv.addEventListener('pointerdown',function(e){drag=true;px=e.clientX;cv.style.cursor='grabbing';try{cv.setPointerCapture(e.pointerId)}catch(x){}});
cv.addEventListener('pointermove',function(e){if(!drag)return;ry+=(e.clientX-px)*0.01;px=e.clientX});
function up(){drag=false;cv.style.cursor='grab'}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
window.addEventListener('resize',function(){W=stage.clientWidth;H=stage.clientHeight;renderer.setSize(W,H);cam.aspect=W/H;cam.updateProjectionMatrix()});
function loop(now){
 requestAnimationFrame(loop);
 var dt=Math.min((now-last)/1000,0.1);last=now;time+=dt;
 if(playing){t+=dt/32;if(t>=1){t=1;playing=false;pb.textContent='Ver de novo'}}
 if(!drag)ry+=dt*0.15;
 g.rotation.y=ry;
 upd();renderer.render(scene,cam);
}
upd();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
